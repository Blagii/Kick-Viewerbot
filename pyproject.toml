[build-system]
requires = ["setuptools>=65.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-viewer-bot"
version = "1.0.0"
description = "YouTube playback session dashboard"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=2.2,<4",
    "flask-cors>=4,<7",
    "flask-socketio>=5.3,<6",
    "python-socketio>=5.10,<6",
    "simple-websocket>=1,<2",
    "requests>=2.28,<3",
    "psutil>=5.9,<8",
    "playwright>=1.50,<2",
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
youtubebot = "backend.main:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
